server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:foodconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

firebase:
  project-id: ${FIREBASE_PROJECT_ID:foodconnect-bb349}
  storage-bucket: ${FIREBASE_STORAGE_BUCKET:foodconnect-bb349.firebasestorage.app}

logging:
  level:
    root: INFO
    com.foodconnect: INFO
