name: FoodConnect Web E2E Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-e2e-test:
    name: Playwright Chromium Web E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install Playwright Chromium & System Dependencies
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Build Web Application Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Execute Playwright End-to-End Web Tests
        working-directory: ./frontend
        run: npx playwright test

      - name: Upload Playwright Test Report & Artifacts on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
